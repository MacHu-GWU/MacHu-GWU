# Fetch the monthly PyPI downloads every week and update the package list in README.md.
#
# state/ is gitignored, so only README.md is committed, and only when the rounded
# badge numbers actually changed. GitHub disables scheduled workflows after 60 days
# without repository activity; the local `mise run publish` pushes keep it alive.
name: pypi-downloads

on:
  schedule:
    - cron: "0 8 * * 1" # every Monday 08:00 US Eastern, DST handled by GitHub
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README.md
        run: python -m machugwu.pypi_downloads
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Update PyPI download badges"
          git push
