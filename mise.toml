# See claude code environment variables documents at https://code.claude.com/docs/en/settings
[env]

[tools]
claude = "latest"
python = "3.12"
uv = "latest"

# === Tasks
[tasks.venv-create]
description = "✨ Create Python virtual environment (.venv)"
run = "uv venv"

[tasks.venv-remove]
description = "💥 Remove Python virtual environment folder (.venv)"
run = "rm -r .venv"

[tasks.inst]
description = "💾 Install Python dependencies (dev, test, doc, etc.) via uv"
run = "uv sync --all-extras"

[tasks.cc-usage]
description = "📊 Collect Claude Code usage into state/claude_code_usage.json and render claude-code-usage.svg"
run = "uv run python -m machugwu.claude_code_usage"

[tasks.pypi-downloads]
description = "📦 Fetch PyPI monthly downloads and update the package list in README.md"
run = "uv run python -m machugwu.pypi_downloads"
